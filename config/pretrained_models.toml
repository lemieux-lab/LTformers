[tahoe_pb.lrecon]
# after re-running lrecon (2026-09-25 fixes), point these at <run>/final, not <run>/best:
# lrecon best-val tracks a moving teacher, so best/ is the epoch with the easiest targets
# rtf = "results/tahoe/pb/pretrain/lrecon/rtf/2026-08-22_17-36/best"
# rtf = "results/tahoe/pb/pretrain/lrecon/rtf/2026-10-05_13-13/best" # 40k final 1jjbq6iy, best val 0.082 (--ckpt final for final/)
# rtf = "results/tahoe/pb/pretrain/lrecon/rtf/2026-10-05_13-13/final" # 40k final 1jjbq6iy, final step
rtf = "results/tahoe/pb/pretrain/lrecon/rtf/2026-10-05_13-13/final/ema" # 40k final 1jjbq6iy, final teacher
# etf = "results/tahoe/pb/pretrain/lrecon/etf/2026-08-27_11-51/best" # 160k steps, best_val_loss=0.0064 (newer script)
# etf = "results/tahoe/pb/pretrain/lrecon/etf/2026-10-02_11-04/best" # 40k final, best val 0.030 (--ckpt final for final/)
# etf = "results/tahoe/pb/pretrain/lrecon/etf/2026-10-02_11-04/final" # 40k final, final step
etf = "results/tahoe/pb/pretrain/lrecon/etf/2026-10-02_11-04/final/ema" # 40k final, final teacher

[tahoe_pb.erecon]
# rtf = "results/tahoe/pb/pretrain/erecon/rtf/2026-08-18_13-15/best"
