# .venv-x86_64/bin/wandb sweep scripts/finetune/pb/w_pretrain/wb/sweep_rtf_mlm_lvl2.yaml
# run_sweep gh18_sbatch rtf_mlm_lvl2 <entity>/PB-FT-Aug/<sweep_id>

program: scripts/finetune/pb/w_pretrain/rank_tf.jl
project: PB-FT-Aug
name: rtf_mlm_lvl2_sweep
method: bayes
metric:
  name: best_val_loss
  goal: minimize
parameters:
  modeltype:
    value: "rtf"
  mode:
    value: "e2e"
  task:
    value: "mlm"
  level:
    value: "lvl2"
  data_format:
    value: "tahoe"
  # wandb_mode: follows local.toml
    # value: "online"
  n_epochs:
    value: 0
  max_ft_steps:
    value: 40000
  batch_size:
    value: 100
  # swept params
  lr:
    distribution: log_uniform_values
    min: 0.00005
    max: 0.01
  drop_prob:
    min: 0.01
    max: 0.3
early_terminate:
  type: hyperband
  min_iter: 5
  eta: 3
  s: 3
command:
  - ${env}
  - julia
  - ${program}
  - ${args}
