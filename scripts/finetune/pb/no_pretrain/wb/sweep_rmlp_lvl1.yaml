# .venv-x86_64/bin/wandb sweep scripts/finetune/pb/no_pretrain/wb/sweep_rmlp_lvl1.yaml
# run_sweep gh18_sbatch L_rmlp_lvl1 serena-chan-/PB-FT-Aug/j3fqycqw

program: scripts/finetune/pb/no_pretrain/rmlp.jl
project: PB-FT-Aug
name: rmlp_nopt_lvl1_sweep
method: bayes
metric:
  name: best_val_loss
  goal: minimize
parameters:
  modeltype:
    value: "rmlp"
  mode:
    value: "e2e"
  level:
    value: "lvl1"
  data_format:
    value: "lincs"
  n_epochs:
    value: 0
  max_ft_steps:
    value: 40000
  batch_size:
    value: 100
  # rank_top_k:
  #   value: 1024
  # swept params
  lr:
    distribution: log_uniform_values
    min: 0.000000005
    max: 0.01
  drop_prob:
    min: 0.01
    max: 0.3
  n_layers:
    values: [2, 4, 6, 8]
early_terminate:
  type: hyperband
  min_iter: 5
  eta: 3
  s: 3
command:
  - ${env}
  - julia
  - ${program}
  - ${args}
