# .venv-x86_64/bin/wandb sweep scripts/finetune/pb/no_pretrain/wb/sweep_elog_lvl1.yaml
# run_sweep gh18_sbatch TPB_elog_lvl1 serena-chan-/PB-FT-Aug/<sweep_id>

program: scripts/finetune/pb/no_pretrain/emlp.jl
project: PB-FT-Aug
name: elog_nopt_lvl1_sweep
method: bayes
metric:
  name: best_val_loss
  goal: minimize
parameters:
  modeltype:
    value: "elog"
  mode:
    value: "e2e"
  level:
    value: "lvl1"
  data_format:
    value: "tahoe"
  n_epochs:
    value: 0
  max_ft_steps:
    value: 20000
  batch_size:
    value: 100
  # swept params — logistic regression: only lr matters
  lr:
    distribution: log_uniform_values
    min: 0.0001
    max: 0.01
  drop_prob:
    value: 0.0
  n_layers:
    value: 0
early_terminate:
  type: hyperband
  min_iter: 3
  eta: 3
  s: 3
command:
  - ${env}
  - julia
  - ${program}
  - ${args}
