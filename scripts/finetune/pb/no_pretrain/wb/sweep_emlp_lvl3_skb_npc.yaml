# .venv-x86_64/bin/wandb sweep scripts/finetune/pb/no_pretrain/wb/sweep_emlp_lvl3_skb_npc.yaml
# run_sweep gh18_sbatch emlp_lvl3_skb_npc serena-chan-/PB-FT-Aug/<sweep_id> 1-00:00:00

program: scripts/finetune/pb/no_pretrain/emlp.jl
project: PB-FT-Aug
name: emlp_nopt_lvl3_SKB_NPC_sweep
method: bayes
metric:
  name: best_val_loss
  goal: minimize
parameters:
  modeltype:
    value: "emlp"
  mode:
    value: "e2e"
  level:
    value: "lvl3"
  data_format:
    value: "lincs"
  n_epochs:
    value: 0
  max_ft_steps:
    value: 20000
  batch_size:
    value: 32
  lincs_source_cell:
    value: "SKB"
  lincs_target_cell:
    value: "NPC"
  lincs_dose:
    value: "10"
  # swept params
  lr:
    distribution: log_uniform_values
    min: 0.00005
    max: 0.01
  drop_prob:
    min: 0.01
    max: 0.3
  n_layers:
    values: [2, 4, 6, 8]
early_terminate:
  type: hyperband
  min_iter: 5
  eta: 3
  s: 3
command:
  - ${env}
  - julia
  - ${program}
  - ${args}
