# .venv-x86_64/bin/wandb sweep scripts/finetune/pb/no_pretrain/wb/sweep_rmlp_lvl2.yaml
# run_sweep gh200_sbatch TPB_rmlp_lvl2 serena-chan-/PB-FT-Aug/oghmlz4k

program: scripts/finetune/pb/no_pretrain/rmlp.jl
project: PB-FT-Aug
name: rmlp_nopt_lvl2_sweep
method: bayes
metric:
  name: best_val_loss
  goal: minimize
parameters:
  modeltype:
    value: "rmlp"
  mode:
    value: "e2e"
  level:
    value: "lvl2"
  data_format:
    value: "tahoe"
  # wandb_mode: follows local.toml
    # value: "online"
  n_epochs:
    value: 0
  max_ft_steps:
    value: 40000
  batch_size:
    value: 500
  # swept params
  lr:
    distribution: log_uniform_values
    # min: 0.00005
    # max: 0.01
    min: 0.000000005
    max: 0.000001
  drop_prob:
    min: 0.01
    max: 0.3
  n_layers:
    values: [2, 4, 6, 8]
early_terminate:
  type: hyperband
  min_iter: 5
  eta: 3
  s: 3
command:
  - ${env}
  - julia
  - ${program}
  - ${args}
