# .venv-x86_64/bin/wandb sweep scripts/pretrain/pb/wb/sweep_erecon_rtf.yaml
# run_sweep gh18_sbatch serena-chan-/PB-PT-Aug/<sweep_id>

program: scripts/pretrain/pb/erecon.jl
project: PB-PT-Aug
name: erecon_rtf_sweep
method: bayes
metric:
  # name: test_loss
  name: val_loss
  goal: minimize
parameters:
  modeltype:
    value: "rtf"
  data_format:
    value: "tahoe"
  wandb_mode:
    value: "online"
  # constant params
  max_steps:
    # value: 160000
    value: 40000
  n_epochs:
    value: 0
  embed_dim:
    value: 128
  hidden_dim:
    value: 128
  n_heads:
    value: 2
  n_layers:
    value: 2
  n_hvg:
    value: 1024
  batch_size:
    value: 100
  # sweep params
  lr:
    # min: 0.0005
    min: 0.001
    max: 0.005
  drop_prob:
    min: 0.1
    max: 0.2
  mask_ratio:
    min: 0.1
    max: 0.3
early_terminate:
  type: hyperband
  min_iter: 3
  eta: 3
  s: 3
command:
  - ${env}
  - julia
  - ${program}
  - ${args}
