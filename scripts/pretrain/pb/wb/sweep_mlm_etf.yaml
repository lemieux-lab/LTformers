# .venv-x86_64/bin/wandb sweep scripts/pretrain/pb/wb/sweep_mlm_etf.yaml
# run_sweep gh18_sbatch serena-chan-/PB-PT-Aug/<sweep_id>

program: scripts/pretrain/pb/mlm.jl
project: PB-PT-Aug
name: mlm_etf_sweep
method: bayes
metric:
  name: test_loss
  goal: minimize
parameters:
  modeltype:
    value: "etf"
  data_format:
    value: "tahoe"
  wandb_mode:
    value: "online"
  max_steps:
    value: 0
  n_epochs:
    value: 30
  lr:
    values: [0.001, 0.002, 0.003, 0.004, 0.005]
  drop_prob:
    min: 0.05
    max: 0.2
  embed_dim:
    values: [64, 128]
  hidden_dim:
    values: [64, 128, 256]
  n_heads:
    values: [1, 2]
  n_layers:
    values: [1, 2]
  mask_ratio:
    min: 0.1
    max: 0.3
early_terminate:
  type: hyperband
  min_iter: 5
  eta: 3
  s: 2
command:
  - ${env}
  - julia
  - ${program}
  - ${args}
