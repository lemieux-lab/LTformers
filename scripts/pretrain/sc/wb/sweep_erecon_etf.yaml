# .venv-x86_64/bin/wandb sweep scripts/pretrain/sc/wb/sweep_erecon_etf.yaml
# run_sweep gh18_sbatch serena-chan-/SC-PT-Aug/<sweep_id>

program: scripts/pretrain/sc/erecon.jl
project: SC-PT-Aug
name: erecon_etf_sweep
method: bayes
metric:
  name: test_loss
  goal: minimize
parameters:
  modeltype:
    value: "etf"
  wandb_mode:
    value: "online"
  # constant params
  max_steps:
    value: 160000
  n_epochs:
    value: 0
  embed_dim:
    value: 128
  hidden_dim:
    value: 128
  n_heads:
    value: 2
  n_layers:
    value: 2
  top_k:
    value: 1024
  # sweep params
  lr:
    min: 0.0005
    max: 0.005
  drop_prob:
    min: 0.05
    max: 0.2
  mask_ratio:
    min: 0.1
    max: 0.3
early_terminate:
  type: hyperband
  min_iter: 3
  eta: 3
  s: 3
command:
  - ${env}
  - julia
  - ${program}
  - ${args}
