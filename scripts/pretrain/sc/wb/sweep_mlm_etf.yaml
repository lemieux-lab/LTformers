# .venv-x86_64/bin/wandb sweep scripts/pretrain/sc/wb/sweep_mlm_etf.yaml
# run_sweep gh18_sbatch serena-chan-/SC-PT-Aug/<sweep_id>

program: scripts/pretrain/sc/mlm.jl
project: SC-PT-Aug
name: mlm_etf_sweep
method: bayes
metric:
  name: test_loss
  goal: minimize
parameters:
  modeltype:
    value: "etf"
  wandb_mode:
    value: "online"
  max_steps:
    value: 0
  n_epochs:
    value: 10
  lr:
    min: 0.0005
    max: 0.005
  drop_prob:
    min: 0.05
    max: 0.2
  embed_dim:
    values: [64, 128]
  hidden_dim:
    values: [128, 256]
  n_heads:
    values: [1, 2, 4]
  n_layers:
    values: [1, 2, 4]
  mask_ratio:
    min: 0.1
    max: 0.3
early_terminate:
  type: hyperband
  min_iter: 3
  eta: 3
  s: 2
command:
  - ${env}
  - julia
  - ${program}
  - ${args}
