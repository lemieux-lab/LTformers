# .venv-x86_64/bin/wandb sweep scripts/pretrain/sc/wb/sweep_lrecon_etf.yaml
# run_sweep gh18_sbatch serena-chan-/SC-PT-Aug/<sweep_id>

program: scripts/pretrain/sc/lrecon.jl
project: SC-PT-Aug
name: lrecon_etf_sweep
method: bayes
metric:
  name: test_loss
  goal: minimize
parameters:
  modeltype:
    value: "etf"
  wandb_mode:
    value: "online"
  max_steps:
    value: 0
  n_epochs:
    value: 30
  lr:
    values: [0.001, 0.002, 0.003, 0.004, 0.005]
  drop_prob:
    min: 0.1
    max: 0.2
  embed_dim:
    values: [32, 64, 128]
  hidden_dim:
    values: [64, 128, 256]
  n_heads:
    values: [1, 2, 4]
  n_layers:
    values: [1, 2, 4]
  mask_ratio:
    min: 0.1
    max: 0.3
  ema_decay:
    min: 0.8
    max: 0.999
  subset_ratio:
    value: 0.3
early_terminate:
  type: hyperband
  min_iter: 5
  eta: 3
  s: 2
command:
  - ${env}
  - julia
  - ${program}
  - ${args}
